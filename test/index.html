/* FlipStudio Pro shared object styles.
   Used by the editor canvas, Preview mode and exported publications.
   Geometry is percentage-based (see engine.js overlayStyle) and text sizes use
   container-query units of the page, so every surface renders the same layout. */

.fs-page {
  position: relative;
  container-type: size;
  overflow: hidden;
  background: #ffffff;
  color: #111827;
}

.fs-page-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: fill;
  display: block;
  pointer-events: none;
  user-select: none;
}

.fs-page-blank {
  position: absolute;
  inset: 0;
  background: #ffffff;
}

.fs-overlay {
  position: absolute;
  box-sizing: border-box;
  transform-origin: 50% 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

.fs-overlay[data-type='text'],
.fs-overlay[data-type='button'],
.fs-overlay[data-type='hotspot'] {
  overflow: visible;
  align-items: stretch;
  justify-content: stretch;
}

.fs-overlay[data-action] {
  cursor: pointer;
}

.fs-overlay[data-type='video'],
.fs-overlay[data-type='audio'] {
  background: rgba(15, 23, 42, 0.08);
}

.fs-overlay img.fs-image {
  width: 100%;
  height: 100%;
  max-width: none;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

.fs-fit-cover { object-fit: cover; }
.fs-fit-contain { object-fit: contain; }
.fs-fit-fill { object-fit: fill; }

.fs-placeholder {
  display: flex;
  width: 100%;
  height: 100%;
  align-items: center;
  justify-content: center;
  padding: 0.5em;
  box-sizing: border-box;
  color: #475569;
  background: repeating-linear-gradient(45deg, #f1f5f9 0 10px, #e2e8f0 10px 20px);
  font: 600 12px/1.3 'Segoe UI', system-ui, sans-serif;
  text-align: center;
}

/* Slideshow */
.fs-overlay[data-type='slideshow'] {
  background: #0f172a;
}

.fs-slides,
.fs-clip {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: inherit;
}

.fs-slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  display: block;
  visibility: hidden;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
  animation-duration: var(--fs-transition, 600ms);
  animation-timing-function: ease;
  animation-fill-mode: both;
}

.fs-slide.is-active,
.fs-slide.is-leaving {
  visibility: visible;
}

.fs-slide.is-active { z-index: 2; }
.fs-slide.is-leaving { z-index: 1; }

.fs-slides[data-transition='fade'] .fs-slide.is-active.dir-forward,
.fs-slides[data-transition='fade'] .fs-slide.is-active.dir-back { animation-name: fs-fade-in; }
.fs-slides[data-transition='fade'] .fs-slide.is-leaving { animation-name: fs-fade-out; }

.fs-slides[data-transition='slide'] .fs-slide.is-active.dir-forward { animation-name: fs-in-from-right; }
.fs-slides[data-transition='slide'] .fs-slide.is-active.dir-back { animation-name: fs-in-from-left; }
.fs-slides[data-transition='slide'] .fs-slide.is-leaving.dir-forward { animation-name: fs-out-to-left; }
.fs-slides[data-transition='slide'] .fs-slide.is-leaving.dir-back { animation-name: fs-out-to-right; }

.fs-slides[data-transition='instant'] .fs-slide.is-leaving { visibility: hidden; }

@keyframes fs-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes fs-fade-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes fs-in-from-right { from { transform: translateX(100%); } to { transform: translateX(0); } }
@keyframes fs-in-from-left { from { transform: translateX(-100%); } to { transform: translateX(0); } }
@keyframes fs-out-to-left { from { transform: translateX(0); } to { transform: translateX(-100%); } }
@keyframes fs-out-to-right { from { transform: translateX(0); } to { transform: translateX(100%); } }

.fs-ss-nav {
  position: absolute;
  top: 50%;
  z-index: 3;
  width: 30px;
  height: 30px;
  min-height: 0;
  margin-top: -15px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  color: #ffffff;
  background: rgba(15, 23, 42, 0.55);
  font: 700 16px/30px system-ui, sans-serif;
  text-align: center;
  cursor: pointer;
}

.fs-ss-nav:hover { background: rgba(15, 23, 42, 0.8); }
.fs-ss-prev { left: 6px; }
.fs-ss-next { right: 6px; }

.fs-ss-dots {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 6px;
  z-index: 3;
  display: flex;
  justify-content: center;
  gap: 6px;
}

.fs-ss-dot {
  width: 9px;
  height: 9px;
  min-height: 0;
  padding: 0;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 50%;
  background: rgba(15, 23, 42, 0.35);
  cursor: pointer;
}

.fs-ss-dot.is-active { background: #ffffff; }

.fs-ss-thumbs {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 3;
  display: flex;
  justify-content: center;
  gap: 4px;
  padding: 4px;
  background: rgba(15, 23, 42, 0.45);
}

.fs-ss-thumb {
  width: 36px;
  height: 24px;
  min-height: 0;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 3px;
  overflow: hidden;
  background: #0f172a;
  opacity: 0.65;
  cursor: pointer;
}

.fs-ss-thumb img {
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: cover;
  display: block;
}

.fs-ss-thumb.is-active {
  border-color: #ffffff;
  opacity: 1;
}

@media (prefers-reduced-motion: reduce) {
  .fs-slide { animation-duration: 1ms !important; }
}

/* ---------- Styled skins (text, button, hotspot) ---------- */

.fs-skin {
  position: relative;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  min-width: 0;
  overflow: visible;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease, opacity 0.22s ease;
}

.fs-text {
  display: block;
  width: 100%;
  min-width: 0;
}

.fs-text-gradient .fs-text {
  background: var(--fs-text-gradient);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}

.fs-marker {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: 2;
  display: grid;
  place-items: center;
  width: 4.4cqw;
  height: 4.4cqw;
  min-width: 16px;
  min-height: 16px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: var(--fs-marker-bg);
  color: var(--fs-marker-color);
  box-shadow: 0 0.4cqw 1.2cqw rgba(15, 23, 42, 0.35);
  font: 700 2.6cqw/1 'Segoe UI', system-ui, sans-serif;
  pointer-events: none;
}

.fs-marker[data-marker='dot'] {
  width: 2.4cqw;
  height: 2.4cqw;
  min-width: 10px;
  min-height: 10px;
}

.fs-tooltip {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 8px);
  z-index: 30;
  width: max-content;
  max-width: 260px;
  padding: 6px 10px;
  transform: translate(-50%, 4px);
  border-radius: 6px;
  background: rgba(15, 23, 42, 0.92);
  color: #ffffff;
  font: 500 clamp(11px, 1.6cqw, 15px)/1.35 'Segoe UI', system-ui, sans-serif;
  text-align: center;
  white-space: normal;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.fs-overlay:hover > .fs-tooltip,
.fs-overlay:focus-visible > .fs-tooltip {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* Hotspot visibility */
.fs-reveal-hover { opacity: 0; }
.fs-overlay:hover > .fs-reveal-hover,
.fs-overlay:focus-visible > .fs-reveal-hover { opacity: 1; }
.fs-reveal-never { opacity: 0; }

/* Hover effects */
.fs-overlay:hover > .fs-hover-lift { transform: translateY(-6%); box-shadow: 0 1.4cqw 3cqw rgba(15, 23, 42, 0.35); }
.fs-overlay:hover > .fs-hover-grow { transform: scale(1.06); }
.fs-overlay:hover > .fs-hover-glow { box-shadow: 0 0 2.4cqw var(--fs-effect-color), 0 0 0.6cqw var(--fs-effect-color); }
.fs-overlay:hover > .fs-hover-darken { filter: brightness(0.86); }
.fs-overlay:hover > .fs-hover-highlight { filter: brightness(1.12) saturate(1.15); box-shadow: inset 0 0 0 999px rgba(255, 255, 255, 0.14); }
.fs-overlay:hover > .fs-hover-underline .fs-text { text-decoration: underline; text-underline-offset: 0.15em; }
.fs-hover-shine,
.fs-fx-shine { overflow: hidden; }
.fs-hover-shine::after,
.fs-fx-shine::after {
  content: '';
  position: absolute;
  top: -20%;
  bottom: -20%;
  left: -60%;
  width: 40%;
  transform: skewX(-20deg);
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
  pointer-events: none;
  opacity: 0;
}
.fs-overlay:hover > .fs-hover-shine::after { animation: fs-shine-sweep 0.8s ease; }
.fs-fx-shine::after { animation: fs-shine-sweep 2.6s ease-in-out infinite; }

/* Idle (attention) effects */
.fs-fx-pulse { animation: fs-pulse 1.8s ease-in-out infinite; }
.fs-fx-glow { animation: fs-glow 2s ease-in-out infinite; }
.fs-fx-bounce { animation: fs-bounce 1.6s ease infinite; }
.fs-fx-float { animation: fs-float 3.2s ease-in-out infinite; }
.fs-fx-wiggle { animation: fs-wiggle 2.8s ease-in-out infinite; }
.fs-fx-blink { animation: fs-blink 1.4s ease-in-out infinite; }
.fs-fx-heartbeat { animation: fs-heartbeat 1.6s ease-in-out infinite; }
.fs-fx-ripple::before,
.fs-fx-beacon .fs-marker::before {
  content: '';
  position: absolute;
  inset: 0;
  border: 0.35cqw solid var(--fs-effect-color);
  border-radius: inherit;
  pointer-events: none;
  animation: fs-ripple 1.8s ease-out infinite;
}
.fs-fx-beacon .fs-marker::before { border-color: var(--fs-marker-bg); }

@keyframes fs-shine-sweep { 0% { left: -60%; opacity: 0; } 15% { opacity: 1; } 60%, 100% { left: 130%; opacity: 0; } }
@keyframes fs-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes fs-glow { 0%, 100% { box-shadow: 0 0 0 transparent; } 50% { box-shadow: 0 0 2.6cqw var(--fs-effect-color); } }
@keyframes fs-bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-12%); } 60% { transform: translateY(-6%); } }
@keyframes fs-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6%); } }
@keyframes fs-wiggle { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(-4deg); } 85% { transform: rotate(4deg); } 95% { transform: rotate(-2deg); } }
@keyframes fs-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes fs-heartbeat { 0%, 40%, 100% { transform: scale(1); } 10%, 30% { transform: scale(1.1); } 20% { transform: scale(0.98); } }
@keyframes fs-ripple { 0% { transform: scale(1); opacity: 0.85; } 100% { transform: scale(1.45); opacity: 0; } }

/* Product pop-up (reader only) */
.fs-popup-backdrop {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(2, 6, 23, 0.62);
  animation: fs-fade-in 0.18s ease both;
}

.fs-popup {
  position: relative;
  display: flex;
  flex-direction: column;
  width: min(420px, 100%);
  max-height: 100%;
  overflow: auto;
  border-radius: 14px;
  background: #ffffff;
  color: #0f172a;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
  font-family: 'Segoe UI', system-ui, sans-serif;
}

.fs-popup img {
  display: block;
  width: 100%;
  max-width: none;
  max-height: 260px;
  object-fit: cover;
}

.fs-popup-body { display: flex; flex-direction: column; gap: 8px; padding: 18px 20px 20px; }
.fs-popup-title { margin: 0; font-size: 20px; font-weight: 700; }
.fs-popup-price { font-size: 18px; font-weight: 700; color: #b45309; }
.fs-popup-text { margin: 0; color: #334155; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
.fs-popup-cta {
  align-self: flex-start;
  margin-top: 6px;
  padding: 10px 18px;
  border-radius: 999px;
  background: #2563eb;
  color: #ffffff;
  font-weight: 600;
  text-decoration: none;
}
.fs-popup-close {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 32px;
  height: 32px;
  min-height: 0;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(15, 23, 42, 0.7);
  color: #ffffff;
  font-size: 18px;
  cursor: pointer;
}

@media (prefers-reduced-motion: reduce) {
  [class*='fs-fx-'],
  [class*='fs-fx-']::before,
  [class*='fs-fx-']::after { animation: none !important; }
}

/* PDF text layer: invisible text positioned over the page image, so text can be
   selected, copied and searched. Hidden from the pointer unless "Select text" is on. */
.fs-textlayer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  line-height: 1;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}
.fs-textlayer > span {
  position: absolute;
  white-space: pre;
  color: transparent;
  font-family: sans-serif;
  transform-origin: 0 0;
  transform: rotate(var(--fs-angle, 0deg)) scaleX(var(--fs-scale-x, 1));
  cursor: text;
}
.fs-textlayer > br { display: none; }
.fs-textlayer > span.fs-hit {
  background: rgba(250, 204, 21, 0.45);
  box-shadow: 0 0 0 0.15em rgba(250, 204, 21, 0.45);
  border-radius: 0.1em;
}
.fs-selecting .fs-textlayer {
  pointer-events: auto;
  user-select: text;
  -webkit-user-select: text;
}
.fs-selecting .fs-textlayer > span::selection { color: transparent; background: rgba(37, 99, 235, 0.35); }

/* FlipStudio Pro reader chrome. Shared by Preview mode and exported publications. */

.fs-reader {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  width: 100%;
  height: 100%;
  min-height: 0;
  color: #e2e8f0;
  background: var(--fs-reader-bg, #0b1220);
  font: 14px/1.4 'Segoe UI', system-ui, sans-serif;
}

.fs-reader-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 12px;
  min-width: 0;
  background: var(--fs-reader-bar, transparent);
}

.fs-reader-bar[hidden] {
  display: none;
}

.fs-reader-btn {
  min-height: 32px;
  padding: 4px 12px;
  color: #e2e8f0;
  background: #1e293b;
  border: 1px solid rgba(148, 163, 184, 0.35);
  border-radius: 6px;
  font: inherit;
  cursor: pointer;
}

.fs-reader-btn:hover:not(:disabled) {
  background: #273449;
}

.fs-reader-btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.fs-reader-btn:focus-visible,
.fs-reader-scrub:focus-visible {
  outline: 2px solid #60a5fa;
  outline-offset: 2px;
}

.fs-reader-count,
.fs-reader-time {
  min-width: 72px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.fs-reader-fullscreen {
  margin-left: auto;
}

.fs-reader-scrub {
  flex: 1 1 200px;
  max-width: 520px;
  min-width: 80px;
}

.fs-stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  padding: 8px;
  overflow: hidden;
}

.fs-book-host {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  min-height: 0;
}

.fs-book {
  position: relative;
  flex: 0 0 auto;
}

.fs-book > .fs-book-page {
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
}

.fs-book .stf__item.fs-page {
  box-shadow: none;
}

/* Search panel */
.fs-search {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 40;
  display: flex;
  flex-direction: column;
  width: min(340px, calc(100% - 16px));
  max-height: calc(100% - 16px);
  color: #0f172a;
  background: #ffffff;
  border-radius: 10px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  overflow: hidden;
}
.fs-search-head { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid #e2e8f0; }
.fs-search-input {
  flex: 1 1 auto;
  min-width: 0;
  padding: 7px 10px;
  font: inherit;
  color: inherit;
  background: #f8fafc;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
}
.fs-search-close { width: 32px; font-size: 20px; line-height: 1; color: #475569; background: none; border: 0; cursor: pointer; }
.fs-search-status { padding: 6px 12px; font-size: 12px; color: #64748b; }
.fs-search-status:empty { display: none; }
.fs-search-results { margin: 0; padding: 0 6px 8px; list-style: none; overflow: auto; }
.fs-search-hit {
  display: grid;
  gap: 2px;
  width: 100%;
  padding: 7px 8px;
  text-align: left;
  font: inherit;
  font-size: 13px;
  color: #334155;
  background: none;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
}
.fs-search-hit:hover, .fs-search-hit:focus-visible { background: #eff6ff; outline: none; }
.fs-search-hit strong { font-size: 11px; color: #2563eb; text-transform: uppercase; letter-spacing: 0.04em; }
.fs-search-hit mark { background: #fde68a; color: inherit; border-radius: 2px; }
.fs-reader-select[aria-pressed='true'] { background: #2563eb; border-color: #2563eb; color: #fff; }

@media (max-width: 600px) {
  .fs-reader-bar { gap: 6px; padding: 6px; }
  .fs-reader-fullscreen { margin-left: 0; }
}

  'fade-out': 'opacity',

  'move-y': 'y',

  rotation: 'rotation',

    },
    setHover(hovered) {
      if (!overlay.pauseOnHover) return
      hoverPaused = hovered
      schedule()
    },
    reset() {
      playing = false
      schedule()
      go(initialSlideIndex(overlay), -1)
    },
    destroy() {
      destroyed = true
      playing = false
      if (timer) clearT(timer)
      timer = 0
    },
  }
  render(index, index, 0)
  return api
}

/**
 * The single cancellable playback clock. Exactly one requestAnimationFrame
 * callback is pending while playing; play() while playing is a no-op.
 * States: 'stopped' (design state, time 0), 'playing', 'paused'.
 */
function createClock(options) {
  const raf = options.requestFrame || ((cb) => requestAnimationFrame(cb))
  const caf = options.cancelFrame || ((id) => cancelAnimationFrame(id))
  const now = options.now || (() => performance.now())
  let duration = Math.max(0, Number(options.duration) || 0)
  let loops = Boolean(options.loops)
  let time = 0
  let state = 'stopped'
  let frameId = 0
  let originWall = 0
  let originTime = 0
  let destroyed = false

  const emit = () => { if (!destroyed && options.onTick) options.onTick(time, state) }
  const cancel = () => { if (frameId) caf(frameId); frameId = 0 }
  const current = () => originTime + (now() - originWall) / 1000
  const tick = () => {
    frameId = 0
    if (state !== 'playing' || destroyed) return
    const t = current()
    if (!loops && t >= duration) {
      time = duration
      state = 'paused'
      emit()
      if (options.onEnd) options.onEnd()
      return
    }
    time = t
    emit()
    frameId = raf(tick)
  }

  return {
    get time() { return time },
    get state() { return state },
    get duration() { return duration },
    configure(next) {
      if (next.duration !== undefined) duration = Math.max(0, Number(next.duration) || 0)
      if (next.loops !== undefined) loops = Boolean(next.loops)
      if (!loops && time > duration) time = duration
    },
    play() {
      if (destroyed || state === 'playing') return
      if (!loops && time >= duration) time = 0
      originWall = now()
      originTime = time
      state = 'playing'
      emit()
      cancel()
      frameId = raf(tick)
    },
    pause() {
      if (state !== 'playing') return
      time = loops ? current() : Math.min(duration, current())
      cancel()
      state = 'paused'
      emit()
    },
    stop() {
      cancel()
      time = 0
      state = 'stopped'
      emit()
    },
    restart() {
      cancel()
      time = 0
      state = 'stopped'
      this.play()
    },
    seek(target) {
      const upper = loops ? Math.max(duration, Number(target) || 0) : duration
      time = clamp(Number(target) || 0, 0, upper)
      if (state === 'playing') {
        originWall = now()
        originTime = time
      } else {
        state = 'paused'
      }
      emit()
    },
    destroy() {
      cancel()
      destroyed = true
      state = 'stopped'
    },
  }
}

// FlipStudio Pro shared object styling: text, button and hotspot appearance,
// idle/hover effects, link actions. Used by the editor canvas, Preview and
// exported publications (inlined verbatim like engine.js), so an object looks
// and behaves the same everywhere.
//
// Rules: no imports, plain ES2020, top-level `function`/`const` only.
//
// Sizes stored in page units (the same units as x/y/width/height) and are
// converted to container-query width units (cqw) of the page, so styling
// scales exactly with the page at any zoom, in Preview and in exports.

const DEFAULT_STYLES = {

    letterSpacing: 0,

  },
  hotspot: {

    lineHeight: 1.1,
    letterSpacing: 0,
    background: 'rgba(251,191,36,0.22)',
    gradient: null,
    textGradient: null,
    borderColor: 'rgba(245,158,11,0.9)',
    borderWidth: 3,
    borderStyle: 'dashed',
    radius: 8,
    padding: 0,
    shadow: 'none',
    textEffect: 'none',
    effectColor: '#f59e0b',
    shape: 'rounded',
    marker: 'none',
    markerColor: '#ffffff',
    markerBackground: '#ef4444',
    reveal: 'always',
    showLabel: false,
  },
}

const IDLE_EFFECTS = ['none', 'pulse', 'glow', 'shine', 'bounce', 'float', 'wiggle', 'blink', 'ripple', 'beacon', 'heartbeat']
const HOVER_EFFECTS = ['none', 'lift', 'grow', 'glow', 'darken', 'highlight', 'shine', 'underline']

function styleFor(overlay) {
  const defaults = DEFAULT_STYLES[overlay.type] || DEFAULT_STYLES.text
  return Object.assign({}, defaults, overlay.style || {})
}

function unit(value, page) {
  return Math.round(((Number(value) || 0) / page.width) * 100 * 10000) / 10000 + 'cqw'
}

function shadowCss(kind, color, page) {
  const c = color || 'rgba(15,23,42,0.35)'
  if (kind === 'soft') return '0 ' + unit(4, page) + ' ' + unit(12, page) + ' rgba(15,23,42,0.22)'
  if (kind === 'medium') return '0 ' + unit(8, page) + ' ' + unit(24, page) + ' rgba(15,23,42,0.32)'
  if (kind === 'strong') return '0 ' + unit(14, page) + ' ' + unit(40, page) + ' rgba(15,23,42,0.45)'
  if (kind === 'glow') return '0 0 ' + unit(24, page) + ' ' + c
  if (kind === 'inset') return 'inset 0 0 0 ' + unit(2, page) + ' ' + c
  return 'none'
}

function textEffectCss(kind, color, page) {
  const c = color || '#000000'
  if (kind === 'shadow') return '0 ' + unit(2, page) + ' ' + unit(6, page) + ' rgba(0,0,0,0.45)'
  if (kind === 'hard') return unit(3, page) + ' ' + unit(3, page) + ' 0 ' + c
  if (kind === 'glow') return '0 0 ' + unit(10, page) + ' ' + c + ', 0 0 ' + unit(22, page) + ' ' + c
  if (kind === 'outline') {
    const w = unit(1.5, page)
    return [w + ' 0 0 ' + c, '-' + w + ' 0 0 ' + c, '0 ' + w + ' 0 ' + c, '0 -' + w + ' 0 ' + c, w + ' ' + w + ' 0 ' + c, '-' + w + ' -' + w + ' 0 ' + c, w + ' -' + w + ' 0 ' + c, '-' + w + ' ' + w + ' 0 ' + c].join(', ')
  }
  if (kind === 'emboss') return '0 ' + unit(1, page) + ' 0 rgba(255,255,255,0.6), 0 -' + unit(1, page) + ' 0 rgba(0,0,0,0.35)'
  return 'none'
}

function gradientCss(gradient) {
  if (!gradient || !gradient.from || !gradient.to) return ''
  return 'linear-gradient(' + (Number(gradient.angle) || 135) + 'deg, ' + gradient.from + ', ' + gradient.to + ')'
}

/**
 * CSS for the inner "skin" element of a text, button or hotspot object.
 * `fontStack` is the resolved CSS font-family list for style.fontFamily.
 */
function skinStyle(overlay, page, fontStack) {
  const s = styleFor(overlay)
  const css = {
    fontFamily: fontStack || "'Segoe UI', system-ui, sans-serif",
    fontSize: round((Number(overlay.fontSize) || 32) / page.width * 100) + 'cqw',
    fontWeight: String(s.fontWeight || 400),
    fontStyle: s.italic ? 'italic' : 'normal',
    textDecoration: s.underline ? 'underline' : 'none',
    textTransform: s.uppercase ? 'uppercase' : 'none',
    textAlign: s.textAlign,
    justifyContent: s.verticalAlign === 'middle' ? 'center' : s.verticalAlign === 'bottom' ? 'flex-end' : 'flex-start',
    color: s.color,
    lineHeight: String(s.lineHeight || 1.2),
    letterSpacing: (Number(s.letterSpacing) || 0) + 'em',
    padding: unit(s.padding, page),
    borderWidth: unit(s.borderWidth, page),
    borderStyle: Number(s.borderWidth) > 0 ? s.borderStyle : 'none',
    borderColor: s.borderColor,
    borderRadius: s.shape === 'circle' ? '50%' : s.shape === 'pill' ? '999px' : s.shape === 'rect' ? '0' : unit(s.radius, page),
    boxShadow: shadowCss(s.shadow, s.effectColor, page),
    textShadow: textEffectCss(s.textEffect, s.effectColor, page),
    background: gradientCss(s.gradient) || s.background || 'transparent',
    '--fs-effect-color': s.effectColor || '#3b82f6',
    '--fs-marker-color': s.markerColor || '#ffffff',
    '--fs-marker-bg': s.markerBackground || '#ef4444',
  }
  if (s.textGradient && s.textGradient.from && s.textGradient.to) {
    css['--fs-text-gradient'] = gradientCss(s.textGradient)
  }
  return css
}

function skinClassName(overlay) {
  const s = styleFor(overlay)
  const classes = ['fs-skin']
  if (overlay.effect && overlay.effect !== 'none') classes.push('fs-fx-' + overlay.effect)
  if (overlay.hoverEffect && overlay.hoverEffect !== 'none') classes.push('fs-hover-' + overlay.hoverEffect)
  if (s.textGradient && s.textGradient.from && s.textGradient.to) classes.push('fs-text-gradient')
  if (overlay.type === 'hotspot' && s.reveal === 'hover') classes.push('fs-reveal-hover')
  if (overlay.type === 'hotspot' && s.reveal === 'never') classes.push('fs-reveal-never')
  return classes.join(' ')
}

/**
 * Frame for image and slideshow objects: rounded corners (or a circle/oval),
 * border and shadow. Applied to the object box, which clips its content.
 */
function frameStyle(overlay, page) {
  const s = overlay.style || {}
  const shape = s.shape || (Number(s.radius) > 0 ? 'rounded' : 'rect')
  const width = Number(s.borderWidth) || 0
  return {
    borderRadius: shape === 'circle' ? '50%' : shape === 'rect' ? '0' : unit(s.radius, page),
    border: width > 0 ? unit(width, page) + ' ' + (s.borderStyle || 'solid') + ' ' + (s.borderColor || '#ffffff') : 'none',
    boxShadow: shadowCss(s.shadow || 'none', s.effectColor, page),
  }
}

/**
 * Crop inside the frame: `zoom` (1 = fit the frame) and the focal point x/y in
 * percent. Implemented by enlarging the image box rather than a transform, so
 * it never conflicts with slideshow transition animations.
 */
function cropStyle(overlay) {
  const crop = overlay.crop || {}
  const zoom = Math.min(5, Math.max(1, Number(crop.zoom) || 1))
  const x = Math.min(100, Math.max(0, crop.x === undefined ? 50 : Number(crop.x)))
  const y = Math.min(100, Math.max(0, crop.y === undefined ? 50 : Number(crop.y)))
  const size = round(zoom * 100) + '%'
  return {
    position: 'absolute',
    width: size,
    height: size,
    left: round((1 - zoom) * x) + '%',
    top: round((1 - zoom) * y) + '%',
    objectPosition: round(x) + '% ' + round(y) + '%',
  }
}

/** Markers (small icons) shown on hotspots. Text glyphs keep exports dependency-free. */
const HOTSPOT_MARKERS = { none: '', plus: '+', info: 'i', cart: '\u{1F6D2}', eye: '\u{1F441}', play: '▶', star: '★', dot: '' }

function round(value) {
  return Math.round(value * 10000) / 10000
}

/** Turns "www.site.com" into "https://www.site.com"; rejects unsafe schemes. */
function normalizeWebUrl(value) {
  const trimmed = String(value || '').trim()
  if (!trimmed) return ''
  if (/^https?:\/\//i.test(trimmed)) return trimmed
  if (/^[a-z][a-z0-9+.-]*:/i.test(trimmed)) return ''
  return 'https://' + trimmed.replace(/^\/+/, '')
}

/**
 * Resolves an object's click action.
 * Returns { kind: 'href', href, newTab } | { kind: 'page', page } | { kind: 'popup' } | null.
 * Legacy objects with only `url` behave as a web link.
 */
function resolveAction(overlay) {
  const link = overlay.link || (overlay.url ? { type: 'url', value: overlay.url, newTab: true } : null)
  if (!link || !link.type || link.type === 'none') return null
  const value = String(link.value || '').trim()
  if (link.type === 'url') {
    const href = normalizeWebUrl(value)
    return href ? { kind: 'href', href, newTab: link.newTab !== false } : null
  }
  if (link.type === 'email') {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) return null
    const subject = link.subject ? '?subject=' + encodeURIComponent(link.subject) : ''
    return { kind: 'href', href: 'mailto:' + value + subject, newTab: false }
  }
  if (link.type === 'phone') {
    const digits = value.replace(/[^\d+]/g, '')
    return digits.replace(/\D/g, '').length >= 5 ? { kind: 'href', href: 'tel:' + digits, newTab: false } : null
  }
  if (link.type === 'whatsapp') {
    const digits = value.replace(/\D/g, '')
    if (digits.length < 7) return null
    const text = link.message ? '?text=' + encodeURIComponent(link.message) : ''
    return { kind: 'href', href: 'https://wa.me/' + digits + text, newTab: true }
  }
  if (link.type === 'page') {
    const page = Math.floor(Number(value))
    return page >= 1 ? { kind: 'page', page: page - 1 } : null
  }
  if (link.type === 'popup') return overlay.popup ? { kind: 'popup' } : null
  return null
}




// FlipStudio Pro publication reader.
//
// Mounted by the editor's Preview mode AND inlined into exported HTML/ZIP
// publications, so Preview is the export. It renders the real pages and objects,
// drives StPageFlip for page turns, runs slideshows through the shared
// slideshow controller and evaluates animations with the shared engine clock.
//
// `mountPublication` returns a handle whose destroy() cancels the animation
// frame, slideshow timers, observers, listeners and the PageFlip instance.

function mountPublication(root, data, options) {
  const opts = options || {}
  const PageFlipCtor = opts.PageFlip || null
  const doc = root.ownerDocument
  const win = doc.defaultView
  const pages = data.pages || []
  const animations = data.animations || []
  const cleanups = []
  const controllers = []
  const animated = {}
  let currentPage = Math.min(Math.max(0, Number(opts.startPage) || 0), Math.max(0, pages.length - 1))
  let book = null
  let bookPortrait = null
  let pageFlipFailed = false
  let destroyed = false
  let selectMode = false
  let bookMouse = null
  const hasText = pages.some((page) => page.text && page.text.length)
  const readerSettings = data.reader || {}
  const textTools = hasText && readerSettings.textTools !== false

  const make = (tag, className, attrs) => {
    const el = doc.createElement(tag)
    if (className) el.className = className
    if (attrs) Object.keys(attrs).forEach((key) => el.setAttribute(key, attrs[key]))
    return el
  }
  const listen = (target, type, handler, capture) => {
    target.addEventListener(type, handler, capture)
    cleanups.push(() => target.removeEventListener(type, handler, capture))
  }
  const applyStyle = (el, style) => {
    Object.keys(style).forEach((key) => {
      if (key.indexOf('--') === 0) el.style.setProperty(key, style[key])
      else el.style[key] = style[key]
    })
  }

  // ---------- chrome ----------
  root.replaceChildren()
  root.classList.add('fs-reader')
  if (readerSettings.background) root.style.setProperty('--fs-reader-bg', readerSettings.background)
  if (readerSettings.toolbar) root.style.setProperty('--fs-reader-bar', readerSettings.toolbar)
  const topBar = make('div', 'fs-reader-bar fs-reader-top')
  const prevButton = make('button', 'fs-reader-btn', { type: 'button', 'data-action': 'previous-page', 'aria-label': 'Previous page' })
  prevButton.textContent = '‹ Previous'
  const pageCount = make('span', 'fs-reader-count', { 'aria-live': 'polite', 'data-role': 'page-count' })
  const nextButton = make('button', 'fs-reader-btn', { type: 'button', 'data-action': 'next-page', 'aria-label': 'Next page' })
  nextButton.textContent = 'Next ›'
  const fullscreenButton = make('button', 'fs-reader-btn fs-reader-fullscreen', { type: 'button', 'data-action': 'fullscreen', 'aria-label': 'Toggle full screen' })
  fullscreenButton.textContent = 'Full screen'
  const selectButton = make('button', 'fs-reader-btn fs-reader-select', { type: 'button', 'data-action': 'select-text', 'aria-pressed': 'false', title: 'Select and copy text' })
  selectButton.textContent = 'Select text'
  const searchButton = make('button', 'fs-reader-btn fs-reader-search', { type: 'button', 'data-action': 'search', 'aria-expanded': 'false', title: 'Search this publication' })
  searchButton.textContent = 'Search'
  topBar.append(prevButton, pageCount, nextButton)
  if (textTools) topBar.append(selectButton, searchButton)
  topBar.append(fullscreenButton)

  const stage = make('div', 'fs-stage')
  const host = make('div', 'fs-book-host')
  stage.append(host)

  const bottomBar = make('div', 'fs-reader-bar fs-reader-bottom')
  const playButton = make('button', 'fs-reader-btn', { type: 'button', 'data-action': 'play' })
  playButton.textContent = 'Play'
  const stopButton = make('button', 'fs-reader-btn', { type: 'button', 'data-action': 'stop' })
  stopButton.textContent = 'Stop'
  const duration = timelineDuration(animations)
  const loops = timelineLoops(animations)
  const scrubber = make('input', 'fs-reader-scrub', { type: 'range', min: '0', max: String(duration || 0), step: '0.01', value: '0', 'aria-label': 'Animation timeline', 'data-action': 'scrub' })
  const timeLabel = make('span', 'fs-reader-time', { 'data-role': 'time' })
  timeLabel.textContent = '0.00s'
  bottomBar.append(playButton, stopButton, scrubber, timeLabel)
  if (!animations.length) {
    bottomBar.hidden = true
  }
  root.append(topBar, stage, bottomBar)

  // ---------- objects ----------
  const createSlideshow = (overlay, el) => {
    const slides = overlay.slides || []
    const fit = 'fs-fit-' + (overlay.fit || 'cover')
    const wrap = make('div', 'fs-slides', { 'data-transition': overlay.transition || 'fade' })
    wrap.style.setProperty('--fs-transition', slideTransitionMs(overlay) + 'ms')
    const images = slides.map((slide, index) => {
      const img = make('img', 'fs-slide ' + fit, { alt: slide.alt || overlay.label || 'Slide ' + (index + 1), draggable: 'false', 'data-slide-index': String(index) })
      if (slide.src) img.src = slide.src
      applyStyle(img, cropStyle(overlay))
      wrap.append(img)
      return img
    })
    el.append(wrap)
    if (!slides.length) {
      const empty = make('div', 'fs-placeholder')
      empty.textContent = 'Slideshow has no images'
      el.append(empty)
      return
    }
    const indicators = overlay.showIndicators || 'dots'
    let marks = []
    if (slides.length > 1 && indicators === 'dots') {
      const dots = make('div', 'fs-ss-dots')
      marks = slides.map((_, index) => {
        const dot = make('button', 'fs-ss-dot', { type: 'button', 'aria-label': 'Show slide ' + (index + 1) })
        dot.addEventListener('click', (event) => { event.stopPropagation(); controller.goTo(index) })
        dots.append(dot)
        return dot
      })
      el.append(dots)
    } else if (slides.length > 1 && indicators === 'thumbnails') {
      const strip = make('div', 'fs-ss-thumbs')
      marks = slides.map((slide, index) => {
        const thumb = make('button', 'fs-ss-thumb', { type: 'button', 'aria-label': 'Show slide ' + (index + 1) })
        const img = make('img', '', { alt: '', draggable: 'false' })
        if (slide.src) img.src = slide.src
        thumb.append(img)
        thumb.addEventListener('click', (event) => { event.stopPropagation(); controller.goTo(index) })
        strip.append(thumb)
        return thumb
      })
      el.append(strip)
    }
    const render = (index, previous, direction) => {
      images.forEach((img, i) => { img.className = slideClassName(i, index, previous, direction) + ' ' + fit })
      marks.forEach((mark, i) => mark.classList.toggle('is-active', i === index))
      el.setAttribute('data-slide', String(index))
    }
    const controller = createSlideshowController(overlay, render)
    controllers.push(controller)
    if (slides.length > 1 && overlay.showControls !== false) {
      const prev = make('button', 'fs-ss-nav fs-ss-prev', { type: 'button', 'aria-label': 'Previous slide' })
      prev.textContent = '‹'
      const next = make('button', 'fs-ss-nav fs-ss-next', { type: 'button', 'aria-label': 'Next slide' })
      next.textContent = '›'
      prev.addEventListener('click', (event) => { event.stopPropagation(); controller.previous() })
      next.addEventListener('click', (event) => { event.stopPropagation(); controller.next() })
      el.append(prev, next)
    }
    el.addEventListener('pointerenter', () => controller.setHover(true))
    el.addEventListener('pointerleave', () => controller.setHover(false))
    if (overlay.autoplay) controller.play()
  }

  // ---------- actions (links, go to page, pop-ups) ----------
  let popupEl = null
  const closePopup = () => {
    if (popupEl) popupEl.remove()
    popupEl = null
  }
  const openPopup = (popup) => {
    closePopup()
    const backdrop = make('div', 'fs-popup-backdrop', { role: 'dialog', 'aria-modal': 'true', 'aria-label': popup.title || 'Details' })
    const card = make('div', 'fs-popup')
    const close = make('button', 'fs-popup-close', { type: 'button', 'aria-label': 'Close' })
    close.textContent = '\u00d7'
    close.addEventListener('click', closePopup)
    card.append(close)
    if (popup.image) card.append(make('img', '', { src: popup.image, alt: popup.title || '' }))
    const body = make('div', 'fs-popup-body')
    if (popup.title) {
      const title = make('h2', 'fs-popup-title')
      title.textContent = popup.title
      body.append(title)
    }
    if (popup.price) {
      const price = make('div', 'fs-popup-price')
      price.textContent = popup.price
      body.append(price)
    }
    if (popup.description) {
      const text = make('p', 'fs-popup-text')
      text.textContent = popup.description
      body.append(text)
    }
    const cta = popup.link ? resolveAction({ type: 'button', link: popup.link }) : null
    if (cta && cta.kind === 'href') {
      const link = make('a', 'fs-popup-cta', { href: cta.href })
      if (cta.newTab) {
        link.setAttribute('target', '_blank')
        link.setAttribute('rel', 'noopener noreferrer')
      }
      link.textContent = popup.buttonLabel || 'Learn more'
      body.append(link)
    } else if (cta && cta.kind === 'page') {
      const link = make('button', 'fs-popup-cta', { type: 'button' })
      link.textContent = popup.buttonLabel || 'Go to page'
      link.addEventListener('click', () => { closePopup(); openPage(cta.page) })
      body.append(link)
    }
    card.append(body)
    backdrop.append(card)
    backdrop.addEventListener('click', (event) => { if (event.target === backdrop) closePopup() })
    stage.append(backdrop)
    popupEl = backdrop
    close.focus()
  }
  const runAction = (action, overlay) => {
    if (!action) return
    if (action.kind === 'page') openPage(action.page)
    else if (action.kind === 'popup' && overlay.popup) openPopup(overlay.popup)
  }

  const buildSkin = (overlay, page) => {
    const skin = make('div', skinClassName(overlay))
    applyStyle(skin, skinStyle(overlay, page, overlay.fontStack))
    const s = styleFor(overlay)
    if (overlay.type !== 'hotspot' || s.showLabel) {
      const text = make('span', 'fs-text', { dir: 'auto' })
      text.textContent = overlay.label || ''
      skin.append(text)
    }
    if (overlay.type === 'hotspot') {
      const marker = s.marker && s.marker !== 'none' ? s.marker : overlay.effect === 'beacon' ? 'dot' : 'none'
      if (marker !== 'none') {
        const dot = make('span', 'fs-marker', { 'data-marker': marker, 'aria-hidden': 'true' })
        dot.textContent = HOTSPOT_MARKERS[marker] || ''
        skin.append(dot)
      }
    }
    return skin
  }

  const createOverlay = (overlay, page) => {
    const action = resolveAction(overlay)
    const isHref = action && action.kind === 'href'
    const el = make(isHref ? 'a' : 'div', 'fs-overlay', { 'data-type': overlay.type, 'data-object-id': overlay.id })
    if (isHref) {
      el.setAttribute('href', action.href)
      if (action.newTab) {
        el.setAttribute('target', '_blank')
        el.setAttribute('rel', 'noopener noreferrer')
      }
      el.setAttribute('data-action', 'link')
    } else if (action) {
      el.setAttribute('role', 'button')
      el.setAttribute('tabindex', '0')
      el.setAttribute('data-action', action.kind)
      el.addEventListener('click', (event) => { event.preventDefault(); runAction(action, overlay) })
      el.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); runAction(action, overlay) }
      })
    }
    if (overlay.type === 'text' || overlay.type === 'button' || overlay.type === 'hotspot') {
      el.append(buildSkin(overlay, page))
      el.setAttribute('aria-label', overlay.label || overlay.type)
    } else if (overlay.type === 'image') {
      if (overlay.src) {
        const img = make('img', 'fs-image fs-fit-' + (overlay.fit || 'cover'), { src: overlay.src, alt: overlay.label || '', draggable: 'false' })
        applyStyle(img, cropStyle(overlay))
        el.append(img)
      } else {
        const empty = make('div', 'fs-placeholder')
        empty.textContent = 'Missing image'
        el.append(empty)
      }
    } else if (overlay.type === 'slideshow') {
      createSlideshow(overlay, el)
    } else if (overlay.type === 'video' || overlay.type === 'audio') {
      if (overlay.src) {
        const media = make(overlay.type, '', { src: overlay.src, controls: '', preload: 'metadata' })
        media.style.width = '100%'
        media.style.height = '100%'
        el.append(media)
      } else {
        el.textContent = overlay.label || ''
      }
    } else {
      el.textContent = overlay.label || ''
    }
    if (overlay.tooltip) {
      const tip = make('span', 'fs-tooltip', { role: 'tooltip' })
      tip.textContent = overlay.tooltip
      el.append(tip)
    }
    applyStyle(el, overlayStyle(overlay, page, null))
    if (overlay.type === 'image' || overlay.type === 'slideshow') applyStyle(el, frameStyle(overlay, page))
    animated[overlay.id] = { el, overlay, page }
    return el
  }

  // ---------- text layer (selectable, copyable, searchable PDF text) ----------
  const textSpans = pages.map(() => [])
  const pageTexts = pages.map(() => ({ text: '', starts: [] }))
  const pct = (value) => Math.round(value * 1000000) / 10000 + '%'
  const buildTextLayer = (page, index) => {
    const layer = make('div', 'fs-textlayer')
    let joined = ''
    page.text.forEach((item) => {
      const span = make('span', '', { 'data-w': String(item.w) })
      span.textContent = item.s
      span.style.left = pct(item.x / page.width)
      span.style.top = pct(item.y / page.height)
      span.style.fontSize = Math.round((item.h / page.width) * 1000000) / 10000 + 'cqw'
      if (item.f) span.style.fontFamily = item.f
      if (item.a) span.style.setProperty('--fs-angle', item.a + 'deg')
      layer.append(span)
      if (item.eol) layer.append(make('br'))
      pageTexts[index].starts.push(joined.length)
      // Runs are joined with single spaces so phrases that wrap across lines are still found.
      joined += /\s$/.test(item.s) ? item.s : item.s + ' '
      textSpans[index].push(span)
    })
    pageTexts[index].text = joined
    return layer
  }
  /** Stretches each text run to the width it has in the PDF (font metrics differ). Size-independent, so done once. */
  const fitText = (index) => {
    const el = pageElements[index]
    if (!el || el.getAttribute('data-text-fit') === '1' || !textSpans[index].length) return
    const pageWidth = el.clientWidth
    if (!pageWidth) return
    const page = pages[index]
    textSpans[index].forEach((span) => {
      const natural = span.offsetWidth
      const target = (Number(span.getAttribute('data-w')) / page.width) * pageWidth
      if (natural > 0 && target > 0) span.style.setProperty('--fs-scale-x', String(Math.round((target / natural) * 10000) / 10000))
    })
    el.setAttribute('data-text-fit', '1')
  }
  const fitVisibleText = () => {
    if (!hasText) return
    visiblePages().forEach(fitText)
  }

  const pageElements = pages.map((page, index) => {
    const el = make('div', 'fs-page fs-book-page', { 'data-page-index': String(index), 'data-page-id': page.id })
    if (page.background) el.append(make('img', 'fs-page-bg', { src: page.background, alt: page.name || 'Page ' + (index + 1), draggable: 'false' }))
    else el.append(make('div', 'fs-page-blank'))
    if (page.text && page.text.length) el.append(buildTextLayer(page, index))
    ;(page.overlays || []).forEach((overlay) => {
      if (overlay.visible === false) return
      el.append(createOverlay(overlay, page))
    })
    return el
  })

  // ---------- animation ----------
  const renderAnimations = (time, state) => {
    const frames = state === 'stopped' && opts.designStateWhenStopped ? {} : sampleFrames(animations, time)
    Object.keys(animated).forEach((id) => {
      const entry = animated[id]
      const css = overlayStyle(entry.overlay, entry.page, frames[id] || null)
      entry.el.style.left = css.left
      entry.el.style.top = css.top
      entry.el.style.opacity = css.opacity
      entry.el.style.transform = css.transform
    })
  }
  const clock = createClock({
    duration,
    loops,
    onTick: (time, state) => {
      renderAnimations(time, state)
      if (doc.activeElement !== scrubber) scrubber.value = String(Math.min(time, duration))
      timeLabel.textContent = time.toFixed(2) + 's'
      playButton.textContent = state === 'playing' ? 'Pause' : 'Play'
      playButton.setAttribute('data-state', state)
      root.setAttribute('data-playback', state)
      if (opts.onTimeChange) opts.onTimeChange(time, state)
    },
  })
  renderAnimations(0, 'paused')
  listen(playButton, 'click', () => { if (clock.state === 'playing') clock.pause(); else clock.play() })
  listen(stopButton, 'click', () => clock.stop())
  listen(scrubber, 'input', () => clock.seek(Number(scrubber.value)))

  // ---------- pages ----------
  /** Indices of the pages currently on screen (one page, or a two-page spread). */
  const visiblePages = () => {
    if (!book || bookPortrait || pages.length < 2) return [currentPage]
    if (pages.length > 2) {
      // showCover: the cover is alone, then spreads start on odd indices.
      if (currentPage === 0) return [0]
      const left = currentPage % 2 === 1 ? currentPage : currentPage - 1
      return left + 1 < pages.length ? [left, left + 1] : [left]
    }
    return [0, 1]
  }
  const updateCount = () => {
    const total = pages.length
    const spread = visiblePages()
    const first = spread[0]
    const last = spread[spread.length - 1]
    pageCount.textContent = (total ? (first === last ? String(first + 1) : (first + 1) + '–' + (last + 1)) : '0') + ' / ' + total
    prevButton.disabled = first <= 0
    nextButton.disabled = last >= total - 1
    root.setAttribute('data-current-page', String(currentPage))
  }
  const onPageOpened = () => {
    updateCount()
    if (hasText) win.requestAnimationFrame(fitVisibleText)
    if (opts.onPageChange) opts.onPageChange(currentPage)
    if (animations.length && data.restartAnimationsOnPageTurn !== false) clock.restart()
  }

  const ratio = pages.length ? pages[0].width / pages[0].height : 0.707
  const measure = () => {
    const rect = stage.getBoundingClientRect()
    return { width: Math.max(0, rect.width - 16), height: Math.max(0, rect.height - 16) }
  }
  const wantsPortrait = (size) => pages.length < 2 || opts.forceSinglePage || size.width < size.height * ratio * 1.35

  const layoutFallback = () => {
    const size = measure()
    let height = size.height
    let width = height * ratio
    if (width > size.width) { width = size.width; height = width / ratio }
    pageElements.forEach((el, index) => {
      el.style.width = Math.max(1, Math.floor(width)) + 'px'
      el.style.height = Math.max(1, Math.floor(height)) + 'px'
      el.hidden = index !== currentPage
    })
  }

  const buildBook = () => {
    const size = measure()
    const portrait = wantsPortrait(size)
    const spreadRatio = portrait ? ratio : ratio * 2
    let width = Math.min(size.width, size.height * spreadRatio)
    if (!width || width < 40) width = Math.max(40, size.width)
    if (book && bookPortrait === portrait && bookMouse === !selectMode) {
      host.firstElementChild.style.width = Math.floor(width) + 'px'
      book.update()
      return
    }
    if (book) {
      book.destroy()
      book = null
    }
    const mount = make('div', 'fs-book')
    mount.style.width = Math.floor(width) + 'px'
    host.replaceChildren(mount)
    bookPortrait = portrait
    if (!PageFlipCtor || pageFlipFailed || !pages.length) {
      pageElements.forEach((el) => mount.append(el))
      layoutFallback()
      updateCount()
      return
    }
    try {
      book = createBook(mount, portrait)
    } catch (error) {
      // A page-turn engine failure must not take the publication down: fall
      // back to one-page-at-a-time navigation with the same pages and objects.
      if (win.console) win.console.warn('FlipStudio: page-turn engine unavailable, using simple navigation.', error)
      book = null
      pageFlipFailed = true
      mount.replaceChildren(...pageElements)
      layoutFallback()
    }
    updateCount()
  }

  const createBook = (mount, portrait) => {
    const instance = new PageFlipCtor(mount, {
      width: pages[0].width,
      height: pages[0].height,
      size: 'stretch',
      minWidth: portrait ? 100000 : 1,
      maxWidth: 6000,
      minHeight: 1,
      maxHeight: 6000,
      usePortrait: portrait,
      autoSize: true,
      showCover: pages.length > 2,
      drawShadow: true,
      maxShadowOpacity: 0.45,
      flippingTime: 700,
      startPage: currentPage,
      mobileScrollSupport: false,
      clickEventForward: true,
      disableFlipByClick: true,
      // While selecting text, dragging must select instead of turning the page.
      useMouseEvents: !selectMode,
      showPageCorners: true,
    })
    bookMouse = !selectMode
    mount.style.minWidth = '0'
    mount.style.minHeight = '0'
    try {
      instance.loadFromHTML(pageElements)
    } catch (error) {
      try { instance.destroy() } catch (destroyError) { void destroyError }
      host.replaceChildren(mount)
      throw error
    }
    // PageFlip's UI (created by loadFromHTML) sets min-width to minWidth×2; in portrait
    // mode that is the huge value used to force single pages, which would make the
    // book overflow the screen on phones. Reset it and lay out again.
    if (mount.style.minWidth !== '0px') {
      mount.style.minWidth = '0'
      mount.style.minHeight = '0'
      if (typeof instance.update === 'function') instance.update()
    }
    instance.on('flip', (event) => {
      currentPage = Number(event.data) || 0
      onPageOpened()
    })
    return instance
  }

  const goPage = (direction) => {
    if (book) {
      if (direction > 0) book.flipNext()
      else book.flipPrev()
      return
    }
    const next = Math.min(pages.length - 1, Math.max(0, currentPage + direction))
    if (next === currentPage) return
    currentPage = next
    layoutFallback()
    onPageOpened()
  }
  /** Opens a page by index (used by "go to page" links). */
  const openPage = (index) => {
    const target = Math.min(pages.length - 1, Math.max(0, index))
    if (book) {
      if (typeof book.flip === 'function') book.flip(target)
      else book.turnToPage(target)
      return
    }
    if (target === currentPage) return
    currentPage = target
    layoutFallback()
    onPageOpened()
  }
  // ---------- select text & search ----------
  const setSelectMode = (on) => {
    selectMode = !!on
    root.classList.toggle('fs-selecting', selectMode)
    selectButton.setAttribute('aria-pressed', String(selectMode))
    selectButton.textContent = selectMode ? 'Done selecting' : 'Select text'
    if (!selectMode && win.getSelection) {
      const selection = win.getSelection()
      if (selection && selection.removeAllRanges) selection.removeAllRanges()
    }
    if (book) buildBook()
    win.requestAnimationFrame(fitVisibleText)
  }
  listen(selectButton, 'click', () => setSelectMode(!selectMode))

  let searchPanel = null
  const clearHits = () => {
    root.querySelectorAll('.fs-textlayer .fs-hit').forEach((span) => span.classList.remove('fs-hit'))
  }
  /** All matches of `query` (case-insensitive) as { page, start, end }. */
  const findMatches = (query) => {
    const needle = query.replace(/\s+/g, ' ').toLocaleLowerCase()
    const results = []
    pageTexts.forEach((entry, page) => {
      const haystack = entry.text.toLocaleLowerCase()
      let from = 0
      while (needle && results.length < 200) {
        const at = haystack.indexOf(needle, from)
        if (at < 0) break
        results.push({ page, start: at, end: at + needle.length })
        from = at + needle.length
      }
    })
    return results
  }
  const highlight = (match) => {
    clearHits()
    const starts = pageTexts[match.page].starts
    textSpans[match.page].forEach((span, i) => {
      const start = starts[i]
      const end = start + span.textContent.length
      if (end > match.start && start < match.end) span.classList.add('fs-hit')
    })
    fitText(match.page)
  }
  const closeSearch = () => {
    if (!searchPanel) return
    searchPanel.remove()
    searchPanel = null
    clearHits()
    searchButton.setAttribute('aria-expanded', 'false')
  }
  const openSearch = () => {
    if (searchPanel) { searchPanel.querySelector('input').focus(); return }
    const panel = make('div', 'fs-search', { role: 'search' })
    const input = make('input', 'fs-search-input', { type: 'search', placeholder: 'Search text…', 'aria-label': 'Search text' })
    const close = make('button', 'fs-search-close', { type: 'button', 'aria-label': 'Close search' })
    close.textContent = '\u00d7'
    const status = make('div', 'fs-search-status', { 'aria-live': 'polite' })
    const list = make('ol', 'fs-search-results')
    const head = make('div', 'fs-search-head')
    head.append(input, close)
    panel.append(head, status, list)
    let timer = 0
    const run = () => {
      list.replaceChildren()
      const query = input.value.trim()
      if (query.length < 2) { status.textContent = query ? 'Type at least 2 letters.' : ''; clearHits(); return }
      const matches = findMatches(query)
      status.textContent = matches.length ? matches.length + (matches.length >= 200 ? '+' : '') + ' result' + (matches.length === 1 ? '' : 's') : 'No results'
      matches.slice(0, 100).forEach((match) => {
        const text = pageTexts[match.page].text
        const item = make('li')
        const button = make('button', 'fs-search-hit', { type: 'button' })
        const label = make('strong')
        label.textContent = 'Page ' + (match.page + 1)
        const before = text.slice(Math.max(0, match.start - 30), match.start).replace(/\s+/g, ' ')
        const after = text.slice(match.end, match.end + 40).replace(/\s+/g, ' ')
        const mark = make('mark')
        mark.textContent = text.slice(match.start, match.end)
        const snippet = make('span')
        snippet.append((match.start > 30 ? '…' : '') + before, mark, after + '…')
        button.append(label, snippet)
        button.addEventListener('click', () => {
          openPage(match.page)
          // Highlight once the page is on screen (after the flip starts).
          win.requestAnimationFrame(() => highlight(match))
          win.setTimeout(() => highlight(match), 750)
        })
        item.append(button)
        list.append(item)
      })
      if (matches[0]) highlight(matches[0])
    }
    input.addEventListener('input', () => { win.clearTimeout(timer); timer = win.setTimeout(run, 180) })
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') { win.clearTimeout(timer); run(); const first = list.querySelector('button'); if (first) first.click() }
      if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); closeSearch(); searchButton.focus() }
    })
    close.addEventListener('click', closeSearch)
    stage.append(panel)
    searchPanel = panel
    searchButton.setAttribute('aria-expanded', 'true')
    input.focus()
  }
  listen(searchButton, 'click', () => { if (searchPanel) closeSearch(); else openSearch() })

  listen(prevButton, 'click', () => goPage(-1))
  listen(nextButton, 'click', () => goPage(1))
  listen(fullscreenButton, 'click', () => {
    if (doc.fullscreenElement) {
      if (doc.exitFullscreen) doc.exitFullscreen().catch(() => undefined)
    } else if (root.requestFullscreen) root.requestFullscreen().catch(() => undefined)
  })
  listen(doc, 'keydown', (event) => {
    const tag = event.target && event.target.tagName ? event.target.tagName.toLowerCase() : ''
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return
    if (event.key === 'Escape' && popupEl) {
      // The pop-up consumes Esc so a host (e.g. the editor's Preview) does not also react to it.
      event.preventDefault()
      event.stopPropagation()
      closePopup()
      return
    }
    if (event.key === 'Escape' && (searchPanel || selectMode)) {
      event.preventDefault()
      event.stopPropagation()
      if (searchPanel) closeSearch()
      else setSelectMode(false)
      return
    }
    if (textTools && (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'f') {
      event.preventDefault()
      openSearch()
      return
    }
    if (event.key === 'ArrowLeft' || event.key === 'PageUp') goPage(-1)
    if (event.key === 'ArrowRight' || event.key === 'PageDown') goPage(1)
  })

  let resizeFrame = 0
  const onResize = () => {
    if (resizeFrame) win.cancelAnimationFrame(resizeFrame)
    resizeFrame = win.requestAnimationFrame(() => {
      resizeFrame = 0
      if (destroyed) return
      buildBook()
      if (!book) layoutFallback()
    })
  }
  if (win.ResizeObserver) {
    const observer = new win.ResizeObserver(onResize)
    observer.observe(stage)
    cleanups.push(() => observer.disconnect())
  } else {
    listen(win, 'resize', onResize)
  }

  buildBook()
  updateCount()
  if (animations.length && opts.autoplay !== false) clock.play()

  return {
    get currentPage() { return currentPage },
    get clock() { return clock },
    get controllers() { return controllers.slice() },
    get book() { return book },
    get selecting() { return selectMode },
    setSelectMode,
    search(query) { return findMatches(String(query || '')).map((match) => ({ page: match.page, start: match.start, end: match.end })) },
    goToPage(index) {
      const target = Math.min(pages.length - 1, Math.max(0, index))
      if (book) book.turnToPage(target)
      currentPage = target
      if (!book) layoutFallback()
      onPageOpened()
    },
    destroy() {
      if (destroyed) return
      destroyed = true
      closePopup()
      closeSearch()
      clock.destroy()
      controllers.forEach((controller) => controller.destroy())
      if (resizeFrame) win.cancelAnimationFrame(resizeFrame)
      cleanups.forEach((fn) => fn())
      if (book) {
        try { book.destroy() } catch (error) { void error }
      }
      book = null
      root.replaceChildren()
      root.classList.remove('fs-reader', 'fs-selecting')
      root.style.removeProperty('--fs-reader-bg')
      root.style.removeProperty('--fs-reader-bar')
    },
  }
}

  var data = JSON.parse(document.getElementById('fs-data').textContent);
  var PageFlip = window.St && window.St.PageFlip ? window.St.PageFlip : null;
  window.flipstudioPublication = mountPublication(document.getElementById('publication'), data, { PageFlip: PageFlip });
})();
    </script>
  </body>
</html>
